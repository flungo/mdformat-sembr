[build-system]
requires = ["hatchling>=1.28", "uv-dynamic-versioning>=0.14,<0.15"]
build-backend = "hatchling.build"

[project]
name = "mdformat-sembr"
dynamic = ["version"]
description = "mdformat plugin that inserts Semantic Line Breaks (sembr.org) as CommonMark soft breaks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mdformat", "markdown", "sembr", "semantic line breaks", "formatter"]
authors = [ { name = "bugrasan" } ]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["mdformat>=1.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://codeberg.org/bugrasan/mdformat-sembr"
"GitHub Mirror" = "https://github.com/bugrasan/mdformat-sembr"

[project.entry-points."mdformat.parser_extension"]
sembr = "mdformat_sembr:_plugin"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
# Without a style the output follows PEP 440, which is what PyPI accepts.
# `strict` makes a tagless tree an error rather than a silent 0.0.0 — a
# shallow CI checkout would otherwise publish 0.0.0 over a real release.
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/mdformat_sembr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
